# Default values for application.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# String to partially override application.fullname template (will maintain the release name).
nameOverride: ""
# String to fully override application.fullname template.
fullnameOverride: ""
# Deploy all the components in specific K8s node(s).
chartNodeSelector: {}

# Component frontend values.
frontend:
  tier: external
  replicaCount: 1

  # Configuration of the container image.
  imagePullSecrets: []
  image:
    repository: eclipseaerios/management-portal-frontend
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Configuration of the service: type and ports.
  service:
    type: NodePort
    ports:
      web:
        port: 80
        targetPort: 80
        containerPort: 80
        nodePort: ""
        protocol: TCP
      https:
        nodePort: ""
        port: 443
        targetPort: 443
        containerPort: 443
        protocol: TCP

  tls:
    enabled: false
    existingSecret: ""
    certs:
      cert: 
      key: 

  ingress:
    certManagerIssuer: letsencrypt-prod
    certManagerClusterIssuer: letsencrypt-prod
    cors: true
    className: nginx
    enabled: false
    hostname: portal.aerios-project.eu
    path: "/"
    tls:
      enabled: true

  resources: {}
  autoscaling:
    enabled: false
  podSecurityContext: {}
  securityContext: {}

  keycloak:
    realm: keycloak-realm
    url: https://keycloak.aerios-project.eu
    sslRequired: all
    resource: managementportal
    pkceMethod: S256

  proxyDnsResolver: kube-dns.kube-system.svc.cluster.local

  # Configure this parameters to deploy the component in specific K8s node(s).
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Component backend values.
backend:
  tier: internal
  replicaCount: 1

  # Configuration of the container image.
  imagePullSecrets: []
  image:
    repository: eclipseaerios/management-portal-backend
    # Overrides the image tag whose default is the chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent

  # Configuration of the service: type and ports.
  service:
    type: NodePort
    ports:
      api:
        port: 8080
        targetPort: 8080
        containerPort: 8080
        nodePort: ""
        protocol: TCP
      notifications:
        nodePort: ""
        port: 8082
        targetPort: 8082
        containerPort: 8082
        protocol: TCP

  resources: {}
  autoscaling:
    enabled: false

  podSecurityContext: {}
  securityContext: {}

  # Include here the environment variables to be used in containers section of the component's manifest.
  envVars:
    logLevel: DEBUG
    securityLogLevel: DEBUG
    ldapLogLevel: DEBUG
    orionUrl: http://orion-ld-broker.default.svc.cluster.local:1026/ngsi-ld/v1/entities
    keycloakUrl: https://keycloak.aerios-project.eu
    keycloakRealm: keycloak-realm
    hloFeUrl: http://hlo-fe-service.default.svc.cluster.local:8081
    epBalancerUrl: http://entrypoint-balancer-api.default.svc.cluster.local:8080
    epBalancerEnabled: false
    ldapUrl: ldap://openldap.default.svc.cluster.local:389
    ldapUsername: cn=admin,dc=example,dc=org
    ldapPassword: ""
    # Optional: inject LDAP_PASSWORD from an existing Secret via secretKeyRef.
    # If name is empty, the plain ldapPassword value above is used.
    existingSecret:
      name: ""
      key: ldap-password

  # Configure this parameters to deploy the component in specific K8s node(s).
  nodeSelector: {}
  tolerations: []
  affinity: {}
